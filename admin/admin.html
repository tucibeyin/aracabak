<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - aracabak</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-button.active { border-color: #3b82f6; color: #3b82f6; }
        .loader { border-top-color: #3498db; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Giriş Formu Konteyneri -->
    <div id="login-container" class="flex items-center justify-center min-h-screen">
        <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-lg">
            <div class="text-center mb-8">
                <h2 class="mt-4 text-2xl font-bold text-gray-800">Admin Paneli Girişi</h2>
            </div>
            <div id="googleSignInButton" class="flex justify-center"></div>
            <div id="password-section" class="mt-6 hidden">
                <p id="google-user-info" class="text-center text-sm text-gray-600 mb-4"></p>
                <div>
                    <label for="adminPassword" class="block text-sm font-medium text-gray-700 mb-2">Admin Şifresi</label>
                    <input type="password" id="adminPassword" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <button id="submitAdminLogin" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-lg transition-colors mt-4">Giriş Yap</button>
            </div>
            <div id="message-container" class="mt-4 text-center text-sm"></div>
        </div>
    </div>

    <!-- Admin Paneli (Dashboard) Konteyneri -->
    <div id="admin-dashboard" class="hidden">
        <header class="bg-white shadow-md">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">Admin Paneli</h1>
                <div>
                    <span id="adminWelcomeMessage" class="text-sm text-gray-600 mr-4"></span>
                    <button id="adminLogoutBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg text-sm">Çıkış Yap</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <!-- Tab Butonları -->
            <div class="border-b border-gray-200 mb-6">
                <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                    <button class="tab-button active whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm" data-tab="ziyaretci-tab">
                        Ziyaretçi İstatistikleri
                    </button>
                    <!-- Gelecekte yeni tablar buraya eklenebilir -->
                </nav>
            </div>

            <!-- Tab İçerikleri -->
            <div id="ziyaretci-tab" class="tab-content">
                <!-- İstatistik Kartları -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Günlük Ziyaret</h3><p id="daily-views" class="text-3xl font-bold">0</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Haftalık Ziyaret</h3><p id="weekly-views" class="text-3xl font-bold">0</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Yıllık Ziyaret</h3><p id="yearly-views" class="text-3xl font-bold">0</p></div>
                </div>

                <!-- Veri Tabloları -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-semibold">Lokasyon Bazlı Ziyaretçiler</h3>
                            <button id="refresh-stats" class="text-blue-500 hover:text-blue-700 text-sm font-medium">Yenile</button>
                        </div>
                        <div class="overflow-y-auto h-80">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50"><tr><th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Ülke</th><th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Şehir</th><th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Sayı</th></tr></thead>
                                <tbody id="locations-table" class="bg-white divide-y divide-gray-200">
                                    <!-- Veriler JS ile buraya eklenecek -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-lg font-semibold mb-4">Son Kayıt Olan Kullanıcılar</h3>
                        <div class="overflow-y-auto h-80">
                            <ul id="latest-users-list" class="divide-y divide-gray-200">
                                <!-- Veriler JS ile buraya eklenecek -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Element Referansları ---
    const loginContainer = document.getElementById('login-container');
    const dashboardContainer = document.getElementById('admin-dashboard');
    const passwordSection = document.getElementById('password-section');
    const googleUserInfo = document.getElementById('google-user-info');
    const adminPasswordField = document.getElementById('adminPassword');
    const submitBtn = document.getElementById('submitAdminLogin');
    const messageContainer = document.getElementById('message-container');
    const refreshBtn = document.getElementById('refresh-stats');
    let googleAuthToken = null;

    // --- Mesaj Gösterme Fonksiyonu ---
    function displayMessage(message, type = 'error') {
        messageContainer.innerHTML = `<p class="font-semibold ${type === 'error' ? 'text-red-600' : 'text-green-600'}">${message}</p>`;
    }

    // --- Google Token'ını İşleme ---
    window.handleGoogleCredentialResponse = (response) => {
        googleAuthToken = response.credential;
        try {
            const payload = JSON.parse(atob(googleAuthToken.split('.')[1]));
            googleUserInfo.textContent = `${payload.name} (${payload.email}) olarak devam ediyorsunuz. Lütfen admin şifrenizi girin.`;
            document.getElementById('googleSignInButton').classList.add('hidden');
            passwordSection.classList.remove('hidden');
            adminPasswordField.focus();
        } catch (e) {
            displayMessage('Google bilgileri alınamadı.', 'error');
        }
    };

    // --- Google Giriş Butonunu Başlatma ---
    function initializeGoogleSignIn(clientId) {
        try {
            google.accounts.id.initialize({ client_id: clientId, callback: handleGoogleCredentialResponse });
            google.accounts.id.renderButton(
                document.getElementById("googleSignInButton"),
                { theme: "outline", size: "large", text: "signin_with", shape: "rectangular", width: "350" }
            );
        } catch (error) {
            displayMessage('Google ile giriş geçici olarak devre dışı.', 'error');
        }
    }

    // --- API İstekleri ---
    async function apiFetch(url, options = {}) {
        const response = await fetch(url, options);
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({ description: 'Bilinmeyen bir hata oluştu.' }));
            throw new Error(errorData.description);
        }
        return response.json();
    }

    // --- Sayfa Düzeni Fonksiyonları ---
    async function showLogin() {
        dashboardContainer.classList.add('hidden');
        loginContainer.classList.remove('hidden');
        try {
            const config = await apiFetch('/api/config');
            if (config.googleClientId) {
                initializeGoogleSignIn(config.googleClientId);
            } else {
                throw new Error("Google Client ID bulunamadı.");
            }
        } catch(error) {
            displayMessage('Giriş yapılandırması yüklenemedi: ' + error.message, 'error');
        }
    }

    function showDashboard(adminData) {
        loginContainer.classList.add('hidden');
        dashboardContainer.classList.remove('hidden');
        if (adminData && adminData.name) {
            document.getElementById('adminWelcomeMessage').textContent = `Hoşgeldin, ${adminData.name}`;
        }
        fetchDashboardStats();
    }

    // --- Veri Çekme ve Gösterme ---
    async function fetchDashboardStats() {
        refreshBtn.disabled = true;
        refreshBtn.textContent = 'Yenileniyor...';
        try {
            const data = await apiFetch('/api/admin/dashboard_stats');
            renderDashboardData(data);
        } catch (error) {
            alert(`İstatistikler yüklenemedi: ${error.message}`);
        } finally {
            refreshBtn.disabled = false;
            refreshBtn.textContent = 'Yenile';
        }
    }

    function renderDashboardData(data) {
        // Kartlar
        document.getElementById('daily-views').textContent = data.daily_views || 0;
        document.getElementById('weekly-views').textContent = data.weekly_views || 0;
        document.getElementById('yearly-views').textContent = data.yearly_views || 0;

        // Lokasyonlar
        const locationsTable = document.getElementById('locations-table');
        locationsTable.innerHTML = data.locations.length ? '' : '<tr><td colspan="3" class="text-center p-4 text-gray-500">Veri bulunamadı.</td></tr>';
        data.locations.forEach(loc => {
            locationsTable.innerHTML += `<tr><td class="px-4 py-3 text-sm">${loc.country}</td><td class="px-4 py-3 text-sm">${loc.city}</td><td class="px-4 py-3 text-sm font-medium">${loc.count}</td></tr>`;
        });

        // Son Kullanıcılar
        const latestUsersList = document.getElementById('latest-users-list');
        latestUsersList.innerHTML = data.latest_users.length ? '' : '<li class="p-4 text-center text-gray-500">Veri bulunamadı.</li>';
        data.latest_users.forEach(user => {
            const date = new Date(user.created_at).toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' });
            latestUsersList.innerHTML += `<li class="py-3 flex justify-between items-center"><div class="text-sm"><p class="font-medium text-gray-800">${user.name}</p><p class="text-gray-500">${user.email}</p></div><span class="text-xs text-gray-400">${date}</span></li>`;
        });
    }

    // --- Olay Dinleyicileri ---
    submitBtn.addEventListener('click', async () => {
        const password = adminPasswordField.value;
        if (!password || !googleAuthToken) {
            return displayMessage('Lütfen tüm alanları doldurun.', 'error');
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Doğrulanıyor...';
        displayMessage('', 'success');

        try {
            await apiFetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: googleAuthToken, password })
            });
            window.location.reload(); // Başarılı girişte sayfayı yenile
        } catch (error) {
            displayMessage(error.message, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Giriş Yap';
        }
    });
    
    document.getElementById('adminLogoutBtn').addEventListener('click', async () => {
        await apiFetch('/api/auth/logout', { method: 'POST' });
        window.location.reload();
    });

    refreshBtn.addEventListener('click', fetchDashboardStats);

    // --- Başlangıç Fonksiyonu ---
    async function initialize() {
        try {
            const data = await apiFetch('/api/admin/status');
            if (data.loggedIn) {
                showDashboard(data);
            } else {
                showLogin();
            }
        } catch (error) {
            showLogin();
        }
    }

    initialize();
});
</script>
</body>
</html>
